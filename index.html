<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패밀리오피스 상담 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#0b3a2d; --g8:#12503e; --g7:#1a6550; --g6:#2b7d63; --mint:#e6f2ec; --mint2:#cbe5d8;
  --bg:#f2f6f4; --card:#fff; --line:#dbe5df; --text:#14211b; --mute:#647069;
  --warn:#9a5d0c; --warn-soft:#fbf0db; --bad:#b03f37; --bad-soft:#f8e2df; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:150px}
main.wrap.adm{padding-bottom:100px}
/* header */
.head{background:linear-gradient(160deg,var(--g9),var(--g8));color:#fff;padding-bottom:22px;border-radius:0 0 22px 22px}
.head.slim{padding-bottom:6px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px;font-size:14px;gap:8px}
.brand{font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar nav{display:flex;gap:4px;flex:0 0 auto}
.topbar nav a,.navbtn{text-decoration:none;padding:6px 12px;border-radius:99px;color:rgba(255,255,255,.78);background:none;border:0;cursor:pointer;font-size:14px}
.topbar nav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.head h1{font-size:26px;font-weight:800;margin:14px 0 4px;letter-spacing:-.02em;line-height:1.3}
.head p{margin:0;color:rgba(255,255,255,.82);font-size:14.5px}
/* sections */
section{margin-top:22px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--g9);font-weight:800}
h2 .n,.step .n{width:22px;height:22px;border-radius:50%;background:var(--g8);color:#fff;font-size:12px;display:inline-grid;place-items:center;flex:0 0 auto}
.cats{display:grid;gap:10px}
.cat{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 44px 14px 16px;cursor:pointer;width:100%}
.cat b{display:block;font-size:16px}
.cat span{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.cat .meta{color:var(--g6);font-weight:700;margin-top:6px;font-size:13px}
.cat.on{border-color:var(--g8);background:#f7fbf9;box-shadow:0 0 0 3px rgba(18,80,62,.1)}
.cat.on::after{content:"✓";position:absolute;right:14px;top:14px;width:22px;height:22px;border-radius:50%;background:var(--g8);color:#fff;display:grid;place-items:center;font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:56px;padding:6px 0 8px;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
.dchip small{display:block;font-size:11px;color:var(--g6);height:15px;line-height:15px;font-weight:700}
.dchip i{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.dchip b{display:block;font-size:20px;line-height:1.2}
.dchip.on{background:var(--g8);border-color:var(--g8);color:#fff}
.dchip.on i,.dchip.on small{color:#bfe3d1}
/* time bars */
.bars{display:grid;gap:10px}
.bhalf{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px}
.bt{font-size:12px;color:var(--mute);margin-bottom:2px;font-weight:700}
.blabels{display:grid;grid-template-columns:repeat(10,1fr);font-size:11.5px;color:var(--mute);margin-bottom:3px}
.blabels span{padding-left:2px}
.bar{display:grid;grid-template-columns:repeat(10,1fr);border-radius:9px;overflow:hidden}
.bar>*{height:46px;border:0;margin:0;padding:0;display:block;border-right:1px solid rgba(255,255,255,.95);font-size:10px;color:#fff;overflow:hidden}
.bar>*:nth-child(2n){border-right:3px solid #fff}
.bar>*:last-child{border-right:0}
.cell{cursor:pointer}
.cell.ok{background:var(--mint2)}
.cell.ok:hover{background:#b5dbc8}
.cell.sel{background:var(--g8)}
.cell.no{background:repeating-linear-gradient(135deg,#eceeed 0 6px,#e2e5e3 6px 12px);cursor:not-allowed}
.cell.on{background:var(--g6)}
.cell.off{background:#e6e9e7}
.cell.open{background:var(--mint2);cursor:default}
.cell.closed{background:#e6e9e7;cursor:default}
.cell.bk{background:var(--g8);cursor:default}
.cell.buf{background:repeating-linear-gradient(135deg,#f3d9a4 0 6px,#fbedd0 6px 12px);cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.picked{margin-top:12px;background:var(--g9);color:#fff;border-radius:12px;padding:12px 14px;font-size:18px;font-weight:800;text-align:center}
.picked small{font-size:13px;font-weight:500;color:#bfe3d1}
.picked.mute{background:#fff;color:var(--mute);font-size:14px;font-weight:500;border:1px dashed var(--line)}
/* forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label.f{display:block;margin-bottom:12px;font-size:13.5px;color:var(--mute)}
label.f em{color:var(--bad);font-style:normal}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;margin-top:5px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g7)}
input[readonly]{background:#f3f5f4;color:var(--mute)}
.bad input,.bad textarea{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--bad);margin-top:4px}
.sub{font-size:12.5px;color:var(--mute);margin-top:4px}
textarea{resize:vertical;min-height:76px}
.pw{letter-spacing:.5em;font-size:20px;text-align:center}
/* buttons */
.cta{position:fixed;left:0;right:0;bottom:0;background:rgba(242,246,244,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
.cta-in{max-width:560px;margin:0 auto}
.sum{font-size:13.5px;color:var(--mute);margin-bottom:7px;min-height:20px;text-align:center}
.sum b{color:var(--g9)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:#e3eae6;color:var(--g9);text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--g8);color:#fff}
.btn.block{width:100%;font-size:16px;padding:16px}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--mint);color:var(--g8)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.done{text-align:center;padding:30px 0 6px}
.tick{width:72px;height:72px;border-radius:50%;background:var(--mint);color:var(--g8);display:grid;place-items:center;margin:0 auto 14px;font-size:36px;font-weight:800}
.tick.wait{background:var(--warn-soft);color:var(--warn)}
.done h3{font-size:22px;margin:0 0 4px;color:var(--g9)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;text-align:left;font-size:15px;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:500}
/* booking cards */
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-pending{background:var(--warn-soft);color:var(--warn)}
.st-confirmed{background:var(--mint);color:var(--g8)}
.st-done{background:#e5ebf0;color:#2d4659}
.st-noshow{background:#eee;color:#555}
.st-canceled{background:var(--bad-soft);color:var(--bad)}
.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
.bk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.when{font-weight:500}.when b{font-size:17px;color:var(--g9)}
.bk-cat{color:var(--g6);font-size:13.5px;font-weight:700;margin:2px 0 6px}
.bk-who{font-size:14.5px}
.bk-memo{margin-top:6px;font-size:13.5px;color:var(--mute);background:#f6f9f7;border-radius:8px;padding:7px 10px;white-space:pre-wrap}
.bufrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--mute)}
.bufrow select{width:auto;margin:0;padding:6px 10px;font-size:13.5px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--g9);color:#fff;border-radius:var(--r);padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{font-size:12px;color:#bfe3d1}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.fchip.on{background:var(--g8);border-color:var(--g8);color:#fff}
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{border:0;background:none;padding:11px 0 10px;font-size:12.5px;color:var(--mute);cursor:pointer}
.bnav button b{display:block;font-size:19px;line-height:1.2}
.bnav button.on{color:var(--g8);font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tog{width:46px;height:27px;border-radius:99px;background:#cdd5d0;position:relative;border:0;cursor:pointer;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--g6)} .tog.on::after{left:22px}
/* admin schedule */
.step{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--g9);margin:18px 0 8px}
.step small{font-weight:500;color:var(--mute);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .h{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.cd{position:relative;aspect-ratio:1/1.05;border:1.5px solid transparent;background:#fff;border-radius:10px;padding:3px 0;text-align:center;cursor:pointer;font-size:14px;line-height:1.25}
.cd small{display:block;font-size:10.5px;color:var(--mute)}
.cd.has{background:var(--mint)} .cd.has small{color:var(--g6);font-weight:700}
.cd.sel{background:var(--g8);color:#fff} .cd.sel small{color:#bfe3d1}
.cd.today b{text-decoration:underline;text-underline-offset:3px}
.cd.past{opacity:.4} .cd.blank{background:none;cursor:default}
.cd .dot{position:absolute;top:2px;right:3px;font-style:normal;font-size:10px;background:#d98e1c;color:#fff;border-radius:99px;min-width:15px;height:15px;line-height:15px;padding:0 3px}
.rng{display:flex;align-items:center;gap:8px}
.rng select{margin:0}
.presets{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.note.warn{background:var(--warn-soft);border-color:#ecd7ab;color:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:34px 10px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.ov{position:fixed;inset:0;background:rgba(11,58,45,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;color:var(--g9);font-weight:800}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--g9);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.loading{padding:90px 0;text-align:center;color:var(--mute)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--g8);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12.5px;text-align:center;padding:6px 10px}
.mini{font-size:12.5px;color:var(--mute)}
.foot{text-align:center;margin-top:36px}
.foot a{color:var(--mute);font-size:12.5px}
textarea.copy{min-height:180px;font:12.5px/1.4 ui-monospace,monospace}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="demo"></div>
<div id="app"><div class="loading"><div class="spin"></div>불러오는 중…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===================== 기본 유틸 ===================== */
const ADMIN_ID = 'hanafo', ADMIN_PW = '3771';
const START = 480, END = 1080, STEP = 30, N = 20;           // 08:00 ~ 18:00, 30분 칸 20개
const BUFS = [0, 30, 60, 90, 120];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const DOW = ['일','월','화','수','목','금','토'];
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const pkey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkey(new Date());
const fmtD = k => { const d = pkey(k); return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; };
const tStr = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const atMs = (date, min) => { const d = pkey(date); d.setHours(0, min, 0, 0); return d.getTime(); };
const ZERO = '0'.repeat(N);
const rangeMask = (s, e) => Array.from({length: N}, (_, i) => { const t = START + i*STEP; return t >= s && t < e ? '1' : '0'; }).join('');
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const STATUS = { pending:'승인대기', confirmed:'확정', done:'완료', noshow:'노쇼', canceled:'취소' };
const LIVE = ['pending','confirmed'];
const hashStr = str => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
async function sha(s) {
  try { if (window.crypto && crypto.subtle && window.TextEncoder) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } } catch(e) {}
  return 'h' + hashStr(s) + hashStr('#' + s);
}
const keyOf = (name, pw) => sha('fo|' + name.trim() + '|' + pw);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch(e) { return null; } };
const ssSet = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch(e) {} };
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ===================== 저장소 어댑터 =====================
   1) config.js 에 Firebase 설정이 있으면 Firestore (GitHub Pages 운영용)
   2) Claude 아티팩트 안에서 열리면 Claude 공유 저장소
   3) 둘 다 없으면 체험 모드 (이 브라우저에만 저장)                       */
function makeLocal() {
  const KEY = 'fo_booking_demo_v2'; let data = {}; const subs = new Set();
  const load = () => { try { data = JSON.parse(lsGet(KEY) || '{}'); } catch(e) { data = {}; } };
  const save = () => lsSet(KEY, JSON.stringify(data));
  const notify = () => subs.forEach(f => f());
  load();
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); notify(); } });
  const colOf = name => { const m = {}; Object.keys(data).forEach(p => { const [c, id] = p.split('/'); if (c === name && id) m[id] = data[p]; }); return m; };
  return {
    mode: 'local',
    watchCol(n, cb) { const f = () => cb(clone(colOf(n))); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    watchDoc(p, cb) { const f = () => cb(clone(data[p] || null)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    async set(p, d) { data[p] = clone(d); save(); notify(); },
    async del(p) { delete data[p]; save(); notify(); },
    async queryEq(c, f, v) { return Object.values(colOf(c)).filter(x => x && x[f] === v).map(clone); },
    async mutate(p, fn) { load(); const r = fn(clone(data[p] || null)) || {}; if (r.data) { data[p] = clone(r.data); save(); notify(); } return r; }
  };
}
function makeClaude(db) {
  const H = 'h' + Math.random().toString(36).slice(2);
  return {
    mode: 'claude',
    watchCol(n, cb, err) { return db.collection(n).onSnapshot(s => { const m = {}; s.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); cb(m); }, err); },
    watchDoc(p, cb, err) { return db.doc(p).onSnapshot(s => cb(s.exists ? s.data() : null), err); },
    set: (p, d) => db.doc(p).set(d),
    del: p => db.doc(p).delete(),
    async queryEq(c, f, v) { const s = await db.collection(c).where(f, '==', v).get(); return s.docs.filter(d => d.exists).map(d => clone(d.data())); },
    async mutate(p, fn) {
      const ref = db.doc(p); let ok = false;
      for (let i = 0; i < 12 && !ok; i++) { const l = await ref.acquire({ holder: H, ttlMs: 2000 }); ok = l.acquired; if (!ok) await sleep(300 + Math.random() * 400); }
      if (!ok) throw { code: 'busy' };
      const s = await ref.get(); const r = fn(s.exists ? clone(s.data()) : null) || {};
      if (r.data) await ref.set(r.data);
      return r;
    }
  };
}
async function makeFirebase(conf) {
  const V = '10.12.2';
  const A = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js');
  const F = await import('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore.js');
  const fs = F.getFirestore(A.initializeApp(conf));
  const ref = p => F.doc(fs, ...p.split('/'));
  return {
    mode: 'firebase',
    watchCol(n, cb, err) { return F.onSnapshot(F.collection(fs, n), s => { const m = {}; s.forEach(d => { m[d.id] = d.data(); }); cb(m); }, err); },
    watchDoc(p, cb, err) { return F.onSnapshot(ref(p), s => cb(s.exists() ? s.data() : null), err); },
    set: (p, d) => F.setDoc(ref(p), d),
    del: p => F.deleteDoc(ref(p)),
    async queryEq(c, f, v) { const s = await F.getDocs(F.query(F.collection(fs, c), F.where(f, '==', v))); return s.docs.map(d => d.data()); },
    async mutate(p, fn) { let out = {}; await F.runTransaction(fs, async tx => { const s = await tx.get(ref(p)); out = fn(s.exists() ? clone(s.data()) : null) || {}; if (out.data) tx.set(ref(p), out.data); }); return out; }
  };
}

};

const sortedCats = () => Object.values(st.cats).sort((a, b) => (a.order || 0) - (b.order || 0));
const activeCats = () => sortedCats().filter(c => c.active !== false);
const resOf = c => (c.advisor && c.advisor.trim()) ? 'a' + hashStr(c.advisor.trim()) : 'c' + c.id;   // 같은 담당자면 분야가 달라도 일정 공유
const dayId = (res, date) => res + '__' + date;
const itemsOf = (res, date) => ((st.days[dayId(res, date)] || {}).items) || {};
const maskOf = (cid, date) => { const a = st.avail[cid]; const m = a && a.days && a.days[date]; return (typeof m === 'string' && m.length === N) ? m : ZERO; };
const hoursOf = m => (m.split('').filter(x => x === '1').length) / 2;

/* 두 상담 사이에는 앞 상담의 이동시간(buf) 이상 비어 있어야 함 */
function findConflict(items, s, e, buf, hardOnly, exId) {
  let soft = null;
  for (const id in items) {
    if (id === exId) continue;
    const it = items[id];
    if (s < it.e && it.s < e) return 'overlap';
    if (s < it.e + (it.buf || 0) && it.s < e + buf) soft = 'buffer';
  }
  return hardOnly ? null : soft;
}
const myBuf = () => st.book.editRec ? (st.book.editRec.buf != null ? st.book.editRec.buf : cfg().buffer) : cfg().buffer;
function validStart(cat, date, t) {
  const e = t + cat.minutes;
  if (t < START || e > END) return false;
  const m = maskOf(cat.id, date);
  for (let x = t; x < e; x += STEP) if (m[(x - START) / STEP] !== '1') return false;
  if (atMs(date, t) < Date.now() + cfg().leadHours * 3600e3) return false;
  return !findConflict(itemsOf(resOf(cat), date), t, e, myBuf(), false, st.book.editId);
}
function hasStart(cat, date) { for (let t = START; t < END; t += STEP) if (validStart(cat, date, t)) return true; return false; }
function availableDates(cat) {
  const a = st.avail[cat.id]; if (!a || !a.days) return [];
  const t = todayKey(), max = dkey(new Date(Date.now() + cfg().maxDays * 864e5));
  return Object.keys(a.days).filter(d => d >= t && d <= max && hasStart(cat, d)).sort();
}

function custBar(cat, date) {
  const sel = st.book.start, selE = sel != null ? sel + cat.minutes : null;
  const row = from => {
    let labels = '', cells = '';
    for (let i = 0; i < 10; i++) {
      const t = from + i * STEP;
      if (i % 2 === 0) labels += `<span style="grid-column:${i + 1}/span 2">${pad(t / 60 | 0)}시</span>`;
      const inSel = sel != null && t >= sel && t < selE;
      if (inSel) cells += `<button class="cell sel" data-act="start" data-v="${t}" aria-label="${tStr(t)} 선택됨"></button>`;
      else if (validStart(cat, date, t)) cells += `<button class="cell ok" data-act="start" data-v="${t}" aria-label="${tStr(t)} 시작"></button>`;
      else cells += '<span class="cell no"></span>';
    }
    return `<div class="blabels">${labels}</div><div class="bar">${cells}</div>`;
  };
  return `<div class="bars"><div class="bhalf"><div class="bt">08 – 13시</div>${row(480)}</div><div class="bhalf"><div class="bt">13 – 18시</div>${row(780)}</div></div>

function dbErr(e) {
  console.error(e); const c = e && e.code;
  toast(c === 'busy' ? '다른 예약을 처리 중이에요. 잠시 후 다시 시도해 주세요'
    : (c === 'invalid_argument' || c === 'permission-denied') ? '저장 권한이 없습니다. 관리자에게 문의해 주세요'
    : c === 'quota_exceeded' ? '저장 공간이 가득 찼습니다' : '잠시 후 다시 시도해 주세요');
}
const dayRemove = (did, id) => S.mutate('days/' + did, d => { const items = Object.assign({}, (d && d.items) || {}); if (!(id in items)) return {}; delete items[id]; return { data: { items } }; });
/* 일자 문서를 잠그고 겹침을 다시 확인한 뒤에만 예약을 저장 (동시 예약 방지) */
async function reserve(rec, old, hardOnly) {
  const did = dayId(rec.res, rec.date), oid = old ? dayId(old.res, old.date) : null;
  let prev = null;
  const r = await S.mutate('days/' + did, d => {
    const items = Object.assign({}, (d && d.items) || {});
    prev = items[rec.id] || null; delete items[rec.id];
    const c = findConflict(items, rec.s, rec.e, rec.buf, hardOnly, null);
    if (c) return { abort: c };
    items[rec.id] = { s: rec.s, e: rec.e, buf: rec.buf };
    return { data: { items } };
  });
  if (r.abort) return { ok: false, reason: r.abort };
  try { await S.set('bookings/' + rec.id, rec); }
  catch(err) {
    await S.mutate('days/' + did, d => { const items = Object.assign({}, (d && d.items) || {}); if (prev) items[rec.id] = prev; else delete items[rec.id]; return { data: { items } }; }).catch(() => {});
    throw err;
  }
  if (oid && oid !== did) await dayRemove(oid, rec.id).catch(() => {});
  return { ok: true };
}
async function cancelBooking(b, by, reason) {
  await S.set('bookings/' + b.id, Object.assign({}, b, { status: 'canceled', canceledBy: by, reason: reason || '', updatedAt: Date.now() }));
  await dayRemove(dayId(b.res, b.date), b.id);
}
async function submitBooking() {

  if (f.name.trim().length < 2 || (!B.editId && !/^\d{4}$/.test(f.pw))) { B.err = true; renderNow(); toast('이름과 비밀번호(숫자 4자리)를 확인해 주세요'); scrollTo$('#sec3'); return; }
  if (!validStart(cat, B.date, B.start)) { B.start = null; renderNow(); toast('선택한 시간이 방금 마감되었어요. 다시 선택해 주세요'); return; }
  B.busy = true; renderNow();
  try {
    const old = B.editRec;
    const key = old ? old.key : await keyOf(f.name, f.pw);
    const rec = Object.assign({}, old || {}, {
      id: old ? old.id : newId('b'), cat: cat.id, catName: cat.name, advisor: cat.advisor || '', res: resOf(cat),
      date: B.date, s: B.start, e: B.start + cat.minutes, minutes: cat.minutes, buf: myBuf(),
      name: old ? old.name : f.name.trim(), branch: f.branch.trim(), memo: f.memo.trim(), key,

      createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now() });
    delete rec.changed; delete rec.reason;
    const r = await reserve(rec, old, false);
    if (!r.ok) { B.busy = false; B.start = null; renderNow(); toast('방금 다른 예약이 들어온 시간이에요. 다른 시간을 선택해 주세요'); return; }
    lsSet('fo_form', JSON.stringify({ name: rec.name, branch: rec.branch }));
    st.mine.auth = { name: rec.name, key }; ssSet('fo_mine', JSON.stringify(st.mine.auth)); st.mine.list = null;
    B.busy = false; B.done = Object.assign({}, rec, { changed: !!old }); B.editId = null; B.editRec = null; f.pw = '';
    renderNow(); window.scrollTo(0, 0);
  } catch(e) { B.busy = false; renderNow(); dbErr(e); }
}

    const mask = rangeMask(480, 1080);
    for (let i = 0; i < base.length; i++) {
      const b = base[i], id = newId('c') + i;
      await S.set('cats/' + id, { id, name: b[0], desc: b[1], minutes: b[2], approval: b[3], advisor: '', active: true, order: i + 1 });
      const days = {}; for (let k = 0; k < 14; k++) { const d = new Date(Date.now() + k * 864e5); if (d.getDay() > 0 && d.getDay() < 6) days[dkey(d)] = mask; }
      await S.set('avail/' + id, { days });
    }
    if (!st.config || !st.config.orgName) await S.set('config/main', DEF);
    toast('샘플 분야 6개와 2주 일정(평일 08–18시)을 만들었습니다');
  } catch(e) { dbErr(e); }
}
function csvText() {
  const rows = Object.values(st.bookings).sort((a, b) => atMs(a.date, a.s) - atMs(b.date, b.s));
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return ['날짜,시작,종료,분야,담당,이름,지점,요청사항,이동시간(분),상태'].concat(rows.map(b => [b.date, tStr(b.s), tStr(b.e), b.catName, b.advisor, b.name, b.branch, b.memo, b.buf, STATUS[b.status]].map(q).join(','))).join('\n');
}
function scrollTo$(sel) { setTimeout(() => { const el = $(sel); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); }
function rangeFromMask(m) { const i = m.indexOf('1'), j = m.lastIndexOf('1'); return i < 0 ? null : [START + i * STEP, START + (j + 1) * STEP]; }
async function writeAvail(cid, updates) {
  const cur = Object.assign({}, (st.avail[cid] && st.avail[cid].days) || {});
  const cutoff = dkey(new Date(Date.now() - 60 * 864e5));
  Object.keys(cur).forEach(k => { if (k < cutoff) delete cur[k]; });
  Object.keys(updates).forEach(k => { if (updates[k] === ZERO) delete cur[k]; else cur[k] = updates[k]; });
  await S.set('avail/' + cid, { days: cur });
}

/* ===================== 동작 ===================== */
const ACT = {
  /* 손님 */
  cat(v) { const B = st.book; B.cat = v; B.start = null; const ds = availableDates(st.cats[v]); B.date = ds.includes(B.date) ? B.date : (ds[0] || null); renderNow(); scrollTo$('#sec2'); },
  date(v) { st.book.date = v; st.book.start = null; renderNow(); },
  start(v) {
    const B = st.book, cat = st.cats[B.cat], t = Number(v);
    if (!validStart(cat, B.date, t)) { toast('이 시간부터는 ' + cat.minutes + '분 상담이 어려워요'); return; }
    const first = B.start == null; B.start = t; renderNow(); if (first) scrollTo$('#sec3');
  },
  submit() { submitBooking(); },
  again() { const B = st.book; B.done = null; B.cat = B.date = B.start = null; B.err = false; B.form.memo = ''; B.form.pw = ''; location.hash = '#book'; renderNow(); window.scrollTo(0, 0); },
  editcancel() { const B = st.book; B.editId = null; B.editRec = null; B.cat = B.date = B.start = null; B.form.memo = ''; location.hash = '#mine'; },
  async mlookup() {
    const M = st.mine, name = ($('#mi-name').value || '').trim(), pw = $('#mi-pw').value || '';
    if (name.length < 2 || !/^\d{4}$/.test(pw)) { M.err = '이름과 비밀번호(숫자 4자리)를 입력해 주세요.'; renderNow(); return; }
    M.loading = true; M.err = ''; renderNow();
    try {
      const key = await keyOf(name, pw), list = await S.queryEq('bookings', 'key', key);
      M.loading = false;
      if (!list.length) { M.err = '일치하는 예약이 없습니다. 이름과 비밀번호를 확인해 주세요.'; renderNow(); return; }
      M.auth = { name, key }; M.list = list; ssSet('fo_mine', JSON.stringify(M.auth)); renderNow();
    } catch(e) { M.loading = false; renderNow(); dbErr(e); }
  },
  mlogout() { st.mine.auth = null; st.mine.list = null; st.mine.err = ''; ssSet('fo_mine', null); renderNow(); },
  medit(v) {
    const b = (st.mine.list || []).find(x => x.id === v); if (!b) return;
    if (!st.cats[b.cat] || st.cats[b.cat].active === false) { toast('지금은 이 분야의 예약 변경이 어려워요. 담당자에게 문의해 주세요'); return; }
    Object.assign(st.book, { cat: b.cat, date: b.date, start: null, editId: b.id, editRec: b, err: false, busy: false, done: null,
      form: { name: b.name, branch: b.branch || '', memo: b.memo || '', pw: '' } });
    const ds = availableDates(st.cats[b.cat]); if (!ds.includes(b.date)) st.book.date = ds[0] || null;
    if (st.book.date === b.date && validStart(st.cats[b.cat], b.date, b.s)) st.book.start = b.s;
    location.hash = '#book';
  },
  mcancel(v) { confirmModal('예약을 취소할까요?', '취소하면 이 시간은 다른 분이 예약할 수 있게 됩니다.', 'mcancel2', v, '예약 취소', false); },
  async mcancel2(v) {
    closeModal(); const b = (st.mine.list || []).find(x => x.id === v); if (!b) return;
    try { await cancelBooking(b, 'customer', ''); toast('예약을 취소했습니다'); await mineRefresh(); } catch(e) { dbErr(e); }
  },
  /* 관리자 */
  login() {
    const id = ($('#l-id').value || '').trim(), pw = $('#l-pw').value || '';
    if (id === ADMIN_ID && pw === ADMIN_PW) { st.adm.logged = true; st.loginErr = false; ssSet('fo_admin', '1'); startAdminSubs(); renderNow(); }
    else { st.loginErr = true; renderNow(); }
  },
  logout() { st.adm.logged = false; ssSet('fo_admin', null); location.hash = '#book'; renderNow(); },
  atab(v) { st.adm.tab = v; renderNow(); window.scrollTo(0, 0); },
  afilter(v) { st.adm.filter = v; renderNow(); },
  async bset(v) {
    const [id, s] = v.split('|'), b = st.bookings[id]; if (!b) return;
    try { await S.set('bookings/' + id, Object.assign({}, b, { status: s, updatedAt: Date.now() })); toast(s === 'confirmed' ? '확정했습니다' : '처리했습니다'); } catch(e) { dbErr(e); }
  },
  bcancel(v) { confirmModal('예약을 취소할까요?', '손님 화면에 “취소”로 표시되고 그 시간이 다시 열립니다.', 'bcancel2', v, '취소 처리', true); },
  async bcancel2(v) {
    const r = (($('#m-reason') || {}).value || '').trim(); closeModal(); const b = st.bookings[v]; if (!b) return;
    try { await cancelBooking(b, 'admin', r); toast('취소했습니다'); } catch(e) { dbErr(e); }
  },
  bedit(v) { const b = st.bookings[v]; if (b) admBookModal(b); },
  admadd(v) { admBookModal(null, v); },
  async admsave(v) {
    const old = v ? st.bookings[v] : null, cat = st.cats[$('#m-cat').value];
    const date = $('#m-date').value, s = Number($('#m-s').value), name = $('#m-name').value.trim(), buf = Number($('#m-buf').value);
    if (!cat || !date) { toast('분야와 날짜를 확인해 주세요'); return; }
    if (name.length < 1) { toast('이름을 입력해 주세요'); return; }
    if (s + cat.minutes > END) { toast('18:00 이후에 끝나는 상담은 등록할 수 없어요'); return; }
    const pwEl = $('#m-pw'), pw = pwEl ? pwEl.value : '';
    if (pw && !/^\d{4}$/.test(pw)) { toast('비밀번호는 숫자 4자리입니다'); return; }
    const rec = Object.assign({}, old || {}, {
      id: old ? old.id : newId('b'), cat: cat.id, catName: cat.name, advisor: cat.advisor || '', res: resOf(cat),
      date, s, e: s + cat.minutes, minutes: cat.minutes, buf, name, branch: $('#m-branch').value.trim(), memo: $('#m-memo').value.trim(),
      key: old ? (old.key || '') : (pw ? await keyOf(name, pw) : ''), status: old ? old.status : 'confirmed', by: old ? (old.by || 'admin') : 'admin',
      createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now() });
    const soft = findConflict(itemsOf(rec.res, date), s, rec.e, buf, false, rec.id);
    try {
      const r = await reserve(rec, old, true);
      if (!r.ok) { toast('같은 시간에 다른 상담이 있어 저장할 수 없습니다'); return; }
      closeModal(); toast(soft ? '저장했습니다 · 이동시간이 겹치니 확인해 주세요' : '저장했습니다');
    } catch(e) { dbErr(e); }
  },
  csv() { modal(`<h3>예약 목록 (CSV)</h3><textarea class="copy" id="m-csv" readonly>${esc(csvText())}</textarea><div class="acts"><button class="btn primary" style="flex:2" data-act="csvcopy">복사</button><button class="btn" data-act="mclose">닫기</button></div><div class="mini" style="margin-top:8px">엑셀에 붙여넣으면 열로 나뉩니다.</div>`); },
  async csvcopy() { const el = $('#m-csv'); el.select(); try { await navigator.clipboard.writeText(el.value); toast('복사했습니다'); } catch(e) { toast('길게 눌러 직접 복사해 주세요'); } },
  mclose() { closeModal(); },
  catnew() { catModal(null); },
  catedit(v) { catModal(v); },
  async catsave(v) {
    const name = $('#m-name').value.trim(); if (!name) { toast('분야 이름을 입력해 주세요'); return; }
    const old = v ? st.cats[v] : null, id = v || newId('c');
    const order = old ? old.order : Math.max(0, ...Object.values(st.cats).map(c => c.order || 0)) + 1;
    const c = { id, name, advisor: $('#m-adv').value.trim(), desc: $('#m-desc').value.trim(), minutes: +$('#m-min').value, approval: $('#m-app').value, active: old ? old.active !== false : true, order };
    try { await S.set('cats/' + id, c); closeModal(); toast('저장했습니다'); } catch(e) { dbErr(e); }
  },
  catdel(v) {
    const live = Object.values(st.bookings).filter(b => b.cat === v && LIVE.includes(b.status) && atMs(b.date, b.e) >= Date.now()).length;
    if (live) { toast('예정된 예약 ' + live + '건이 있어 삭제할 수 없습니다. 스위치로 숨겨 주세요'); return; }
    confirmModal('분야를 삭제할까요?', '이 분야의 열린 일정도 함께 삭제됩니다. 지난 예약 기록은 남습니다.', 'catdel2', v, '삭제', false);
  },
  async catdel2(v) { closeModal(); try { await S.del('cats/' + v); await S.del('avail/' + v); toast('삭제했습니다'); } catch(e) { dbErr(e); } },
  async cattog(v) { const c = st.cats[v]; try { await S.set('cats/' + v, Object.assign({}, c, { active: c.active === false })); } catch(e) { dbErr(e); } },
  async catmove(v) {
    const [id, d] = v.split('|'), cs = sortedCats(), i = cs.findIndex(c => c.id === id), j = i + Number(d);
    if (j < 0 || j >= cs.length) return;
    try { await S.set('cats/' + cs[i].id, Object.assign({}, cs[i], { order: j + 1 })); await S.set('cats/' + cs[j].id, Object.assign({}, cs[j], { order: i + 1 })); } catch(e) { dbErr(e); }
  },
  seed() { seedData(); },
  schedcat(v) { st.adm.schedCat = v; st.adm.sel = []; renderNow(); },
  sdate(v) {
    const A = st.adm, was = A.sel.length;
    A.sel = A.sel.includes(v) ? A.sel.filter(x => x !== v) : A.sel.concat(v).sort();
    if (was === 0 && A.sel.length === 1) { const m = maskOf(A.schedCat, v), r = rangeFromMask(m); if (r) { A.mask = m; A.rs = r[0]; A.re = r[1]; } }
    renderNow();
  },
  mon(v) { const [y, m] = st.adm.month.split('-').map(Number), d = new Date(y, m - 1 + Number(v), 1); st.adm.month = d.getFullYear() + '-' + pad(d.getMonth() + 1); renderNow(); },
  weekdays() {
    const A = st.adm, [Y, M] = A.month.split('-').map(Number), dim = new Date(Y, M, 0).getDate(), t = todayKey(), s = new Set(A.sel);
    for (let d = 1; d <= dim; d++) { const dt = new Date(Y, M - 1, d), k = dkey(dt); if (k >= t && dt.getDay() > 0 && dt.getDay() < 6) s.add(k); }
    A.sel = Array.from(s).sort(); renderNow();
  },
  selclear() { st.adm.sel = []; renderNow(); },
  preset(v) { const [s, e] = v.split('|').map(Number), A = st.adm; A.rs = s; A.re = e; A.mask = rangeMask(s, e); renderNow(); },
  mcell(v) { const A = st.adm, i = Number(v), m = A.mask.split(''); m[i] = m[i] === '1' ? '0' : '1'; A.mask = m.join(''); renderNow(); },
  async savesched() {
    const A = st.adm, t = todayKey(), dates = A.sel.filter(d => d >= t);
    if (!dates.length) { toast('지난 날짜는 저장하지 않습니다'); return; }
    if (A.mask === ZERO) { toast('열 시간을 선택해 주세요 (닫으려면 “선택일 닫기”)'); return; }
    const up = {}; dates.forEach(d => { up[d] = A.mask; });
    try { await writeAvail(A.schedCat, up); toast(dates.length + '일에 상담 가능 시간을 저장했습니다'); } catch(e) { dbErr(e); }
  },
  async closesched() {
    const A = st.adm, up = {}; A.sel.forEach(d => { up[d] = ZERO; });
    try { await writeAvail(A.schedCat, up); toast(A.sel.length + '일을 닫았습니다 (기존 예약은 유지)'); } catch(e) { dbErr(e); }
  },
  async cfgsave() {
    const d = st.adm.cfgDraft || cfg();
    const c = { orgName: String(d.orgName || '').trim() || DEF.orgName, notice: String(d.notice || '').trim(), contact: String(d.contact || '').trim(),
      buffer: BUFS.includes(Number(d.buffer)) ? Number(d.buffer) : 60,
      leadHours: Math.max(0, Number(d.leadHours) || 0), maxDays: Math.min(120, Math.max(1, Number(d.maxDays) || 30)), cancelHours: Math.max(0, Number(d.cancelHours) || 0) };
    try { await S.set('config/main', c); st.adm.cfgDraft = null; toast('저장했습니다'); } catch(e) { dbErr(e); }
  }
};
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('ov')) { closeModal(); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (fn) { if (t.tagName === 'A') e.preventDefault(); fn(t.dataset.v, t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) { if (t.dataset.bind === 'pw') { const v = t.value.replace(/\D/g, '').slice(0, 4); if (v !== t.value) t.value = v; } st.book.form[t.dataset.bind] = t.value; }
  else if (t.dataset.cfg) st.adm.cfgDraft = Object.assign({}, st.adm.cfgDraft || cfg(), { [t.dataset.cfg]: t.value });
  else if (t.id === 'mi-pw' || t.id === 'm-pw') { const v = t.value.replace(/\D/g, '').slice(0, 4); if (v !== t.value) t.value = v; }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.change, A = st.adm;
  if (t.dataset.cfg) st.adm.cfgDraft = Object.assign({}, st.adm.cfgDraft || cfg(), { [t.dataset.cfg]: t.value });
  if (!k) return;
  if (k === 'catfilter') { A.catFilter = t.value; renderNow(); }
  else if (k === 'buf') setBuf(t.dataset.v, Number(t.value));
  else if (k === 'rs' || k === 're') {
    A[k] = Number(t.value);
    if (A.re <= A.rs) { if (k === 'rs') A.re = Math.min(END, A.rs + 60); else A.rs = Math.max(START, A.re - 60); }
    A.mask = rangeMask(A.rs, A.re); renderNow();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target && e.target.id;
  if (id === 'l-id' || id === 'l-pw') ACT.login();
  else if (id === 'mi-name' || id === 'mi-pw') ACT.mlookup();
});
function route() {
  const h = (location.hash || '#book').slice(1);
  st.view = ['book', 'mine', 'admin'].includes(h) ? h : 'book';
  if (st.view === 'mine' && st.mine.auth && !st.mine.list && !st.mine.loading && st.ready) mineRefresh();
  renderNow(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ===================== 시작 ===================== */
let unsubBookings = null;
function startAdminSubs() { if (unsubBookings || !S) return; unsubBookings = S.watchCol('bookings', m => { st.bookings = m || {}; render(); }, e => { console.error(e); st.connErr = true; render(); }); }
(async function boot() {
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  const conf = window.FIREBASE_CONFIG;
  if (conf && conf.projectId) {
    try { S = await makeFirebase(conf); } catch(e) { console.error(e); st.fatal = '예약 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'; renderNow(); return; }
  } else {
    try { if (typeof claude !== 'undefined' && claude.use) { const db = await withTimeout(claude.use('db'), 8000); if (db) S = makeClaude(db); } } catch(e) { S = null; }
    if (!S) S = makeLocal();
  }
  st.mode = S.mode;
  st.adm.logged = ssGet('fo_admin') === '1';
  try { const a = JSON.parse(ssGet('fo_mine') || 'null'); if (a && a.key) st.mine.auth = a; } catch(e) {}
  try { const f = JSON.parse(lsGet('fo_form') || '{}'); if (f.name) st.book.form.name = f.name; if (f.branch) st.book.form.branch = f.branch; } catch(e) {}
  const need = new Set(['config', 'cats', 'avail', 'days']);
  const slowT = setTimeout(() => { if (!st.ready) { st.ready = true; st.slow = true; render(); } }, 10000);
  const got = k => { need.delete(k); if (!need.size && !st.ready) { st.ready = true; clearTimeout(slowT); if (st.view === 'mine' && st.mine.auth && !st.mine.list) mineRefresh(); } st.slow = false; render(); };
  const er = e => { console.error(e); st.connErr = true; render(); };
  S.watchDoc('config/main', d => { st.config = d || {}; got('config'); }, er);
  S.watchCol('cats', m => { st.cats = m || {}; got('cats'); }, er);
  S.watchCol('avail', m => { st.avail = m || {}; got('avail'); }, er);
  S.watchCol('days', m => { st.days = m || {}; got('days'); }, er);
  if (st.adm.logged) startAdminSubs();
  route();
})();
</script>
